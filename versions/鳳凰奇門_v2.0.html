<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鳳凰奇門（星飛門轉・置閏法）｜製作：Sheng</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* ===== 中國風：宣紙底 ===== 以多層漸層模擬紙纖維，免外部圖檔 */
  body { font-family:"Microsoft JhengHei","PingFang TC",serif;
         background:
           radial-gradient(ellipse at 50% -12%, rgba(255,255,255,.85), rgba(255,255,255,0) 58%),
           repeating-linear-gradient(90deg, rgba(150,118,72,.055) 0 1px, rgba(0,0,0,0) 1px 4px),
           repeating-linear-gradient(0deg, rgba(150,118,72,.045) 0 1px, rgba(0,0,0,0) 1px 5px),
           linear-gradient(166deg,#f8f4e9 0%,#f2e9d8 46%,#e7dabd 100%);
         background-attachment:fixed;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 12px 42px; color:#3a2c1e; }
  /* ===== 標題：匾額感（楷體・描白邊・朱紅細線夾菱形） ===== */
  .kfont, h1, .subhd, .ju-title, .gz-line, .btn { font-family:"標楷體","DFKai-SB","KaiTi","Kaiti TC","BiauKai","Microsoft JhengHei",serif; }
  /* 標題區：左右各一隻剪紙鳳凰（向量、離線、可縮放不糊） */
  .site-head { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:22px; }
  .head-mid { text-align:center; min-width:0; }
  .phoenix { width:clamp(56px,11vw,104px); height:auto; flex:0 0 auto; display:block;
             filter:drop-shadow(0 2px 4px rgba(140,47,38,.20)); }
  .phoenix.mirror { transform:scaleX(-1); }
  h1 { font-size:36px; letter-spacing:14px; text-indent:14px; font-weight:bold;
       color:#4a3728; text-shadow:0 1px 0 #fffdf6, 0 2px 5px rgba(74,55,40,.24); }
  .title-rule { display:flex; align-items:center; justify-content:center; gap:10px; width:min(360px,72%); margin:8px auto 7px; }
  .title-rule i { flex:1; height:1px; background:linear-gradient(90deg, rgba(176,58,46,0), #b03a2e 42%, #b03a2e 58%, rgba(176,58,46,0)); }
  .title-rule b { width:8px; height:8px; background:#b03a2e; transform:rotate(45deg); box-shadow:0 0 0 2px #f6efe0; }
  .site-sub { font-size:13px; letter-spacing:3px; color:#8a7a5f; }
  /* ===== 卡片：宣紙箋（雙框＋四角回紋角飾） ===== */
  .card { position:relative; background:linear-gradient(180deg,#fffdf7 0%,#fdf8ee 100%);
          border:1px solid #d9c6a0; border-radius:3px;
          box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 6px 18px rgba(74,55,40,.13);
          padding:20px 24px; width:100%; max-width:980px; margin-bottom:18px; }
  .card::after { content:""; position:absolute; inset:5px; pointer-events:none; border:1px solid rgba(176,58,46,.22); }
  .card::before { content:""; position:absolute; inset:5px; pointer-events:none; opacity:.55;
    background:
      linear-gradient(#b03a2e,#b03a2e) left top/16px 2px no-repeat,
      linear-gradient(#b03a2e,#b03a2e) left top/2px 16px no-repeat,
      linear-gradient(#b03a2e,#b03a2e) right top/16px 2px no-repeat,
      linear-gradient(#b03a2e,#b03a2e) right top/2px 16px no-repeat,
      linear-gradient(#b03a2e,#b03a2e) left bottom/16px 2px no-repeat,
      linear-gradient(#b03a2e,#b03a2e) left bottom/2px 16px no-repeat,
      linear-gradient(#b03a2e,#b03a2e) right bottom/16px 2px no-repeat,
      linear-gradient(#b03a2e,#b03a2e) right bottom/2px 16px no-repeat; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; justify-content:center; }
  .fld { display:flex; flex-direction:column; gap:4px; }
  .fld label { font-size:13px; font-weight:bold; color:#6b5335; }
  .inline { display:flex; gap:6px; }
  input[type=number], select { font-family:inherit; font-size:16px; padding:7px 10px; border:1px solid #cbb083; border-radius:3px;
       background:#fffdf7; color:#33302a; outline:none; box-shadow:0 1px 2px rgba(120,95,60,.10) inset; }
  input:focus, select:focus { border-color:#b03a2e; box-shadow:0 0 0 2px rgba(176,58,46,.15); }
  /* 按鈕：印鈕感（漸層朱紅／赭褐） */
  .btn { font-size:16px; padding:9px 20px; border:1px solid #8f2d23; border-radius:3px;
         background:linear-gradient(180deg,#c24a3c,#a3302a); color:#fff8ee; cursor:pointer; letter-spacing:3px; text-indent:3px;
         box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 3px 7px rgba(140,47,38,.28); }
  .btn:hover { background:linear-gradient(180deg,#a83b2f,#8a2620); }
  .btn2 { border-color:#5e4728; background:linear-gradient(180deg,#8d6c40,#6f5431); box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 3px 7px rgba(90,70,40,.26); }
  .btn2:hover { background:linear-gradient(180deg,#7a5c34,#5e4728); }
  /* 盤面標頭（仿真詮）：墨框＋內朱線 */
  .header-box { border:2px solid #4a3728; background:linear-gradient(180deg,#fdf9ef,#f7f0dd); padding:16px 20px; border-radius:3px; }
  .ju-title { font-size:30px; font-weight:bold; letter-spacing:6px; color:#b03a2e; text-align:center; }
  /* 陰遁局：標題改為鋼青藍（陽遁維持朱紅），色源取自使用者指定色票 #7E9CB6 */
  .ju-title.yin { color:#7e9cb6; }
  .ju-alias { text-align:center; font-size:14px; color:#6b5335; margin-top:2px; }
  .gz-line { text-align:center; font-size:20px; font-weight:bold; margin-top:8px; letter-spacing:2px; }
  /* 四柱：日柱・時柱「同色」強調（顏色統一隨遁別 — 陽遁朱紅、陰遁深藍） */
  .gz-line .s, .gz-line .b { color:#b03a2e; }
  .gz-line.yin .s, .gz-line.yin .b { color:#1a5276; }
  .fuzhu { display:flex; flex-wrap:wrap; justify-content:center; gap:8px 18px; margin-top:10px; font-size:14px; }
  .fuzhu b { color:#b03a2e; }
  .pill { background:#f4ecd9; border:1px solid #dcc9a3; border-radius:3px; padding:3px 12px; }
  .warn { color:#b03a2e; font-weight:bold; }
  /* 九宮盤 */
  .grid-wrap { display:flex; justify-content:center; }
  /* 九宮盤：木框棋盤（外粗墨框＋內均勻格線，以 gap 鋪底色成線） */
  .grid9 { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; width:100%; max-width:640px;
           padding:2px; background:#9a7b47; border:2px solid #6f5430; border-radius:2px;
           box-shadow:0 3px 10px rgba(74,55,40,.20); }
  .cell { border:0; background:#fbf6ea; min-height:172px; padding:26px 6px 8px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  .cell.mid { background:#f3ead6; }
  .gong-name { position:absolute; top:5px; left:8px; font-size:13px; color:#6b5335; font-weight:bold; }
  /* 真詮式緊湊排列：三欄對齊（干｜神/門｜星），欄寬固定使上下兩行欄位精確對齊；欄距加大避免框線擠到鄰字 */
  .row1, .row2 { display:grid; grid-template-columns:1.3em 1.3em 1.9em; justify-content:center; align-items:center; column-gap:20px; white-space:nowrap; }
  .row1 > span, .row2 > span { text-align:center; }
  .god  { font-size:26px; color:#c96f1e; font-weight:bold; }
  .door { font-size:26px; font-weight:bold; color:#1e7a3c; }
  .star { font-size:26px; font-weight:bold; color:#8a7d23; }
  /* 標記樣式：值符星、值使門採「文字網底」；吉門（休生開）採綠框；若吉門同時為值使門則框線＋網底並存
     字框固定尺寸（1.15em 見方）＋框線固定 1.65em 見方置中，與字型/筆畫寬度無關，保證所有框大小完全一致 */
  .star.zf, .door.zs, .door.ji { justify-self:center; display:inline-flex; align-items:center; justify-content:center;
    width:1.15em; height:1.15em; border-radius:6px; }
  .star.zf { background:#f7e3a1; }
  .door.zs { background:#f9d4a8; }
  .door.ji { position:relative; }
  .door.ji::after {
    content:""; position:absolute; left:50%; top:50%; width:1.65em; height:1.65em; transform:translate(-50%,-50%);
    border:2.5px solid #2e7d32; border-radius:9px; pointer-events:none;
  }
  .gan-tian { font-size:26px; font-weight:bold; color:#6a3d9a; line-height:1.2; }
  .gan-di   { font-size:26px; font-weight:bold; color:#1a5276; line-height:1.2; }
  .badges { position:absolute; top:4px; right:6px; display:flex; flex-direction:column; gap:2px; align-items:flex-end; }
  .bdg { font-size:11px; background:#b03a2e; color:#fff; border-radius:4px; padding:1px 5px; }
  .bdg.blue { background:#1a5276; } .bdg.gray { background:#7a6a4f; }
  .dorgood { color:#1e7a3c; } .dorbad { color:#b03a2e; } .dormid { color:#8a6d1f; }
  /* 逐宮明細（仿真詮：乾坎艮震巽離坤兌） */
  table.det { border-collapse:collapse; width:100%; }
  table.det th, table.det td { border:1px solid #d8c49a; padding:6px 4px; text-align:center; font-size:13px; }
  table.det th { background:linear-gradient(180deg,#f7efdc,#eee2c8); color:#5a3a26; font-size:14px; letter-spacing:1px; }
  table.det td.gname { background:#f8f2e2; font-weight:bold; font-size:15px; }
  table.det td.note { font-size:12px; color:#8a2d23; line-height:1.5; }
  /* 區塊標題：朱紅菱形印記＋細底線 */
  .subhd { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:bold; letter-spacing:5px; color:#7a2f22;
           margin:4px 0 14px; padding-bottom:7px; border-bottom:1px solid rgba(176,58,46,.22); }
  .subhd::before { content:""; width:9px; height:9px; background:#b03a2e; transform:rotate(45deg);
                   box-shadow:0 0 0 3px rgba(176,58,46,.16); flex:0 0 auto; }
  /* 解盤 */
  .jie { font-size:14px; line-height:1.9; }
  .jie h3 { font-size:15px; color:#b03a2e; margin:10px 0 4px; }
  .jie ul { padding-left:20px; }
  .small { font-size:12px; color:#8a7a5f; line-height:1.7; }
  .err { color:#b03a2e; font-weight:bold; text-align:center; display:none; margin-top:10px; }
  .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .grp { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
  /* 數字輸入隱藏微調箭頭，避免佔寬、手機顯示更清爽 */
  input[type=number] { -moz-appearance:textfield; appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  /* 手機版（窄螢幕自適應） */
  @media (max-width: 680px){
    body { padding:16px 8px 30px; }
    .site-head { margin-bottom:16px; gap:10px; }
    .phoenix { width:clamp(52px,13.5vw,76px); }
    h1 { font-size:26px; letter-spacing:8px; text-indent:8px; }
    .title-rule { width:min(240px,80%); }
    .site-sub { font-size:12px; letter-spacing:2px; }
    .card { padding:14px; }
    .card::before, .card::after { inset:3px; }
    .row { flex-direction:column; align-items:stretch; gap:10px; }
    .row > .btn { width:100%; }
    .grp { gap:8px; }
    .grp > .fld { flex:1 1 0; min-width:0; }
    #custBox > .fld { flex:1 1 calc(33.333% - 8px); min-width:0; }
    .grp > .fld input, .grp > .fld select { width:100% !important; }
    .fld label { font-size:12px; }
    .fld.wide { flex:1 1 100%; }
    #lonBox { flex:1 1 100%; }
    #lonBox input { width:100% !important; }
    /* 陽曆／農曆：年／月／日 一行，時／分 一行（不裁切） */
    .fld.wide .inline { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; width:100%; }
    .fld.wide .inline > * { width:100% !important; min-width:0; }
    .fld.wide .inline > :nth-child(-n+3) { grid-column:span 2; }
    .fld.wide .inline > :nth-child(n+4) { grid-column:span 3; }
    input[type=number], select { font-size:15px; padding:6px 8px; }
    .btn { font-size:15px; padding:9px 14px; letter-spacing:1px; }
    .header-box { padding:10px; }
    .ju-title { font-size:24px; letter-spacing:3px; }
    .gz-line { font-size:17px; letter-spacing:1px; }
    .fuzhu { font-size:12px; gap:6px 10px; }
    .pill { padding:3px 9px; }
    .grid9 { gap:1px; padding:1px; }
    .cell { min-height:118px; padding:20px 3px 5px; gap:9px; }
    .god, .door, .star, .gan-tian, .gan-di { font-size:20px; }
    .row1, .row2 { column-gap:11px; }
    .gong-name { font-size:10px; top:3px; left:4px; }
    .bdg { font-size:9px; padding:0 4px; }
    table.det { min-width:600px; }
    table.det th, table.det td { font-size:11px; padding:4px 2px; }
    .subhd { font-size:16px; }
    .jie { font-size:13px; }
  }
</style>
</head>

<script>
/* ================= 基礎資料 ================= */
const STEMS=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const BRANCHES=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];

const GZ=i=>STEMS[((i%10)+10)%10]+BRANCHES[((i%12)+12)%12];
/* 農曆用國字數字：1–99 → 一、二…十、十一…二十一…三十 */
const CN_D="〇一二三四五六七八九";
function cnNum(n){
  n=Math.floor(n);
  if(!(n>=0&&n<=99)) return String(n);
  if(n<10) return CN_D[n];
  if(n===10) return "十";
  const t=Math.floor(n/10), o=n%10;
  return (t===1?"十":CN_D[t]+"十")+(o?CN_D[o]:"");
}
/* 年份逐位轉國字：2026 → 二〇二六 */
function cnYear(y){ return String(y).split("").map(d=>CN_D[+d]||d).join(""); }

/* ================= 農曆（1900–2100）→ 陽曆 ================= */
const LUNAR_INFO=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,

0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,

0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,

0x0d520];
function leapMonth(y){return LUNAR_INFO[y-1900]&0xf;}
function leapDays(y){return leapMonth(y)?((LUNAR_INFO[y-1900]&0x10000)?30:29):0;}
function monthDays(y,m){return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29;}
function lYearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1){s+=(LUNAR_INFO[y-1900]&i)?1:0;}return s+leapDays(y);}
// 農曆 (y,m,d,isLeapMonth) → 陽曆 {y,m,d}；1900-01-31 為農曆 1900 年正月初一
function lunar2solar(y,m,d,isLeap){
  if(y<1900||y>2100) return null;
  const leap=leapMonth(y);
  if(isLeap&&leap!==m) return null;
  let off=0;
  for(let i=1900;i<y;i++) off+=lYearDays(i);
  for(let i=1;i<m;i++){ off+=monthDays(y,i); if(i===leap) off+=leapDays(y); }
  if(isLeap) off+=monthDays(y,m);
  off+=d-1;
  const dt=new Date(Date.UTC(1900,0,31)+off*86400000);
  return {y:dt.getUTCFullYear(),m:dt.getUTCMonth()+1,d:dt.getUTCDate()};
}
// 時辰（代表時）：早子0、丑1、寅3…亥21、晚子23
const HZ_LIST=[[0,"早子時（00:00–00:59）"],[1,"丑時（01–02）"],[3,"寅時（03–04）"],[5,"卯時（05–06）"],
  [7,"辰時（07–08）"],[9,"巳時（09–10）"],[11,"午時（11–12）"],[13,"未時（13–14）"],[15,"申時（15–16）"],
  [17,"酉時（17–18）"],[19,"戌時（19–20）"],[21,"亥時（21–22）"],[23,"晚子時（23:00–23:59）"]];
const HZ_NAME={0:"早子時",1:"丑時",3:"寅時",5:"卯時",7:"辰時",9:"巳時",11:"午時",13:"未時",15:"申時",17:"酉時",19:"戌時",21:"亥時",23:"晚子時"};
// 由實際小時回推時辰名（早子／晚子分列，其餘依時支）
function hzNameOf(h){const b=Math.floor(((h+1)%24)/2);return (h===0?"早":h===23?"晚":"")+(BRANCHES[b]||"")+"時";}

function toggleCal(){
  const lunar=document.getElementById("cal").value==="lunar";
  document.getElementById("solarBox").style.display = lunar?"none":"";
  document.getElementById("lunarBox").style.display = lunar?"":"none";
}
function refreshLunarUI(){
  const ly=+document.getElementById("ly").value;
  if(!ly||ly<1901||ly>2099) return;
  const lmSel=document.getElementById("lm");
  const prev=lmSel.value;
  const leap=leapMonth(ly), vals=[];
  let html="";
  for(let m=1;m<=12;m++){
    html+=`<option value="${m}">${cnNum(m)}月</option>`; vals.push(String(m));
    if(leap===m){ html+=`<option value="${m}L">閏${cnNum(m)}月</option>`; vals.push(m+"L"); }
  }
  lmSel.innerHTML=html;
  if(prev&&vals.indexOf(prev)>=0) lmSel.value=prev;
  refreshDays();
}
function refreshDays(){
  const ly=+document.getElementById("ly").value;
  const lmv=document.getElementById("lm").value;
  if(!ly||!lmv) return;
  const ldSel=document.getElementById("ld");
  const isLeap=lmv.slice(-1)==="L", m=parseInt(lmv);
  const days=isLeap?leapDays(ly):monthDays(ly,m);
  const prev=+ldSel.value||1;
  let html="";
  for(let d=1;d<=days;d++) html+=`<option value="${d}">${cnNum(d)}日</option>`;
  ldSel.innerHTML=html;
  if(prev<=days) ldSel.value=prev;
}

/* ---- 陽曆→農曆（反查，供兩曆同步） ---- */
function solar2lunar(Y,M,D){
  let off=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(1900,0,31))/86400000);
  if(off<0) return null;
  let y=1900;
  for(;y<=2100;y++){ const dy=lYearDays(y); if(off<dy) break; off-=dy; }
  if(y>2100) return null;
  const leap=leapMonth(y);
  let m=1,isLeap=false,ok=false;
  while(m<=12){
    const dm=monthDays(y,m);
    if(off<dm){ ok=true; break; }
    off-=dm;
    if(m===leap){ const dl=leapDays(y); if(off<dl){ isLeap=true; ok=true; break; } off-=dl; }
    m++;
  }
  if(!ok) return null;
  return {y, m, d:off+1, isLeap};
}

/* ---- 「時」「分」下拉選項（0–23 時、0–59 分），陽曆與農曆共用 ---- */
function fillHM(hid,mid){
  const hh=document.getElementById(hid), mi=document.getElementById(mid);
  if(!hh||!mi) return;
  if(!hh.options||!hh.options.length){
    let a="",b="";
    for(let i=0;i<24;i++) a+=`<option value="${i}">${String(i).padStart(2,"0")}時</option>`;
    for(let i=0;i<60;i++) b+=`<option value="${i}">${String(i).padStart(2,"0")}分</option>`;
    hh.innerHTML=a; hh.value="11";
    mi.innerHTML=b; mi.value="0";
  }
}

/* ---- 陽曆欄位（年／月／日／時／分，與農曆同款式） ---- */
function initSolarUI(){
  const sm=document.getElementById("sm");
  if(!sm.options||!sm.options.length){
    let html="";
    for(let m=1;m<=12;m++) html+=`<option value="${m}">${m}月</option>`;
    sm.innerHTML=html; sm.value="1";
  }
  fillHM("shh","smi");
  refreshSolarDays();
}
function refreshSolarDays(){
  const sy=+document.getElementById("sy").value;
  const sm=+document.getElementById("sm").value;
  if(!sy||!sm) return;
  const days=new Date(sy,sm,0).getDate(); // 該年該月天數（自動處理閏年）
  const sd=document.getElementById("sd");
  const prev=+sd.value||1;
  let html="";
  for(let d=1;d<=days;d++) html+=`<option value="${d}">${d}日</option>`;
  sd.innerHTML=html;
  if(prev<=days) sd.value=prev;
}

/* ================= 曆法計算 ================= */
function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function jdnToYMD(j){let a=j+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),
  d2=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d2/4),m2=Math.floor((5*e+2)/153);
  return {y:100*b+d2-4800+Math.floor(m2/10), m:m2+3-12*Math.floor(m2/10), d:e-Math.floor((153*m2+2)/5)+1};}
// 日干支：2000-01-07 = 甲子
const dayGZ=j=>(((j-2451551)%60)+60)%60;

// 太陽視黃經（Meeus 低階式）
function sunLambda(jd){
  const T=(jd-2451545.0)/36525.0;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const Mr=(357.52911+35999.05029*T-0.0001537*T*T)*Math.PI/180;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(Mr)
        +(0.019993-0.000101*T)*Math.sin(2*Mr)+0.000289*Math.sin(3*Mr);
  const om=(125.04-1934.136*T)*Math.PI/180;
  const lam=L0+C-0.00569-0.00478*Math.sin(om);
  return ((lam%360)+360)%360;
}
// 某年某黃經度之交節「日」JDN（北京時間 UTC+8）
function termJDN(year,angle){
  let jd=jdn(year,1,1)-0.5+((angle-280+360)%360)/0.98565;
  for(let k=0;k<10;k++){
    const diff=((angle-sunLambda(jd)+540)%360)-180;
    jd+=diff/0.98565;
  }
  return Math.floor(jd+8/24+0.5);
}
function yearTerms(y){
  return YEAR_TERMS.map(n=>{
    const a=TERM_ANGLE.find(t=>t[0]===n)[1];
    return {name:n, j:termJDN(y,a)};
  }).sort((x,z)=>x.j-z.j);
}
// 五鼠遁時干支（日干支 idx + 時支 idx）
function hourGZ(dayIdx,brIdx){
  const I0=[0,12,24,36,48][dayIdx%5]; // 子時干支序：甲己→0 乙庚→12 丙辛→24 丁壬→36 戊癸→48
  return ((I0+brIdx)%60+60)%60;        // 時支 = 時辰支序 brIdx
}

/* ================= 置閏法定局（串連式） =================
   原理：以「正授」錨點（符頭＝節氣同日）為基準，把時間切成 15 日一「塊」
   （每塊之上元符頭為甲子／己卯／甲午／己酉）。逐塊串連推進節氣；僅在
   「芒種（陽遁）／大雪（陰遁）」且該塊符頭超前節氣 9 日以上時，於其後
   插入一塊「同節氣」的閏奇（重複上中下三元），之後才進入下一節氣。
   置閏律具自鎖定性：任意起始相位都會在數十年內收斂到同一絕對相位，
   故 1912 年以後之定局結果唯一。 */
const Z_ANCHOR_J=jdn(2025,8,23);              // 甲子日
const Z_ANCHOR_TI=YEAR_TERMS.indexOf("處暑");
const Z_THR=9;
let Z_MAP=null;
const _tc={};
const _yrTerms=y=>_tc[y]||(_tc[y]=yearTerms(y));
function _termDay(name,nearJ){                 // 取距 nearJ 最近之「name」節氣 JDN
  const y=jdnToYMD(nearJ).y;let best=null,bd=1e9;
  for(let k=y-1;k<=y+1;k++)for(const t of _yrTerms(k))if(t.name===name){
    const d=Math.abs(t.j-nearJ);if(d<bd){bd=d;best=t.j;}}
  return best;
}
const _zidx=ti=>((ti%24)+24)%24;
function buildZMap(){
  if(Z_MAP)return Z_MAP;
  const map={},LO=jdn(1901,1,2),HI=jdn(2099,12,30);
  const kLo=Math.floor((LO-Z_ANCHOR_J)/15)+1,kHi=Math.floor((HI-Z_ANCHOR_J)/15)-1;
  let k=kLo,ti=0;
  while(k<=kHi){
    const J=Z_ANCHOR_J+k*15,t=YEAR_TERMS[_zidx(ti)],sup=_termDay(t,J)-J;
    map[J]={t:t,d:sup,run:false};
    if((t==="芒種"||t==="大雪")&&sup>Z_THR&&(k+1)<=kHi){
      const J2=Z_ANCHOR_J+(k+1)*15;
      map[J2]={t:t,d:_termDay(t,J2)-J2,run:true};
      k+=2;
    }else k+=1;
    ti+=1;
  }
  return Z_MAP=map;
}
function dingJu(dayJ){
  const map=buildZMap();
  // F = 符頭（最近甲／己日 ≤ dayJ）；依符頭地支定元；F1 = 該元所屬塊之上元符頭
  let F=dayJ;while(!(dayGZ(F)%10===0||dayGZ(F)%10===5))F--;
  const F_gz=GZ(dayGZ(F)),F_branch=F_gz[1];
  const SHANG=["子","午","卯","酉"],ZHONG=["寅","申","巳","亥"];
  const yuan=SHANG.includes(F_branch)?0:ZHONG.includes(F_branch)?1:2;
  const F1=F-yuan*5;
  const m=map[F1];
  if(!m){                                       // 超出 1901–2099：退回夾逼法
    const y=jdnToYMD(dayJ).y,terms=[];for(let yy=y-3;yy<=y+1;yy++)terms.push(...yearTerms(yy));
    terms.sort((a,z)=>a.j-z.j);
    let Tp=null,Tn=null;for(const t of terms){if(t.j<=F1)Tp=t;else{Tn=t;break;}}
    if(!Tn)Tn=terms[terms.length-1];
    const T=(Tn.j-F1)<(F1-Tp.j)?Tn:Tp;
    return {dun:YANG_TERMS.includes(T.name)?"陽":"陰",ju:SANYUAN[T.name][yuan],term:{name:T.name},
            yuan,label:"—",fuTou:F_gz,isRun:false};
  }
  const t=m.t;
  return {dun:YANG_TERMS.includes(t)?"陽":"陰",ju:SANYUAN[t][yuan],term:{name:t},yuan,
          label:m.run?"閏奇":(m.d>0?"超神":(m.d<0?"接氣":"正授")),
          fuTou:GZ(dayGZ(F1)),isRun:!!m.run};
}

/* ================= 年柱／月柱（以節氣為界） ================= */
function yearMonthGZ(Y, dayJ){
  const terms=[];for(let yy=Y-1;yy<=Y+1;yy++)terms.push(...yearTerms(yy));
  terms.sort((a,b)=>a.j-b.j);
  // 年柱：以立春為界（yearTerms 物件無 .y，改用立春 JDN 反推年份）
  const lichunList=terms.filter(t=>t.name==="立春");
  const lc=lichunList.reduce((a,t)=>t.j<=dayJ?t:a,lichunList[0]);
  const LY=jdnToYMD(lc.j).y;
  const yearIdx=((LY-4)%60+60)%60;
  // 月柱：五虎遁（以節氣定月支）
  const jieNames=["立春","驚蟄","清明","立夏","芒種","小暑","立秋","白露","寒露","立冬","大雪","小寒"];
  const jieMap={"立春":2,"驚蟄":3,"清明":4,"立夏":5,"芒種":6,"小暑":7,"立秋":8,"白露":9,"寒露":10,"立冬":11,"大雪":0,"小寒":1};
  let mS=null;
  for(const t of terms){ if(jieNames.includes(t.name)&&t.j<=dayJ){ if(!mS||t.j>mS.j){mS=t;} } }
  const mBr=mS?jieMap[mS.name]:1; // 月支序（子0丑1寅2…）
  const yueGanStart=[2,4,6,8,0][yearIdx%5]; // 五虎遁：甲己→丙 乙庚→戊 丙辛→庚 丁壬→壬 戊癸→甲
  const monthGanIdx=(yueGanStart+((mBr-2+12)%12))%10;
  return {yearIdx, monthGanIdx, mBr};
}
// 干序＋支序 → 六十甲子序（0–59）
function gzIdx(g,b){ for(let i=0;i<60;i++) if(i%10===g&&i%12===b) return i; return 0; }

/* ================= 排盤（星飛門轉・飛盤） ================= */
function paipan(dayJ, brIdx, hourIdx, juInfo, dayIdx){
  const dun=juInfo.dun, ju=juInfo.ju;
  const dir=dun==="陽"?1:-1;
  // 地盤：戊起 ju 宮，陽順陰逆，序 戊己庚辛壬癸丁丙乙
  const earthGan={};
  YI_ORDER.forEach((g,k)=>{ earthGan[((ju-1+dir*k)%9+9)%9+1]=g; });
  const gongOfYi={}; for(const g in earthGan) gongOfYi[earthGan[g]]=+g;

  // 旬首
  const xunIdx=Math.floor(hourIdx/10)*10; // 時辰旬首干支序
  const xunYi=YI_ORDER[Math.floor(xunIdx/10)]; // 戊~癸
  const xunName=XUNSHOU[Math.floor(xunIdx/10)].gz;
  const g0=gongOfYi[xunYi]; // 旬首儀地盤宮

  // 時干（甲→用旬首儀）
  const hStem=STEMS[hourIdx%10];
  const effGan=hStem==="甲"?xunYi:hStem;
  const p=gongOfYi[effGan]; // 時干地盤宮

  // 值符（旬首宮之地盤星）、值使（旬首宮之地盤門）
  const starOfGong={}; XING.forEach(s=>starOfGong[s.g]=s.n);
  const zhiFuXing=starOfGong[g0];
  const zhiShiMen=DOOR_OF_GONG[g0]||"死門"; // 中五寄坤二→死門

  // 天盤九星：值符星隨時干宮，恆順飛（洛書順），不管陰陽（中五寄坤二）
  const skyStar={};
  const gZF=XING.find(s=>s.n===zhiFuXing).g;
  XING.forEach(s=>{
    skyStar[((p-1+(s.g-gZF))%9+9)%9+1]=s.n;
  });
  // 天盤干：星所帶原宮之干
  const skyGan={};
  for(const g in skyStar){ skyGan[g]=earthGan[XING.find(s=>s.n===skyStar[g]).g]; }

  // 值使落宮：旬首宮起，陽順陰逆數 n 時辰（中五寄二）
  const n=hourIdx-xunIdx;
  let shiGong=((g0-1+dir*n)%9+9)%9+1;
  if(shiGong===5) shiGong=2;
  // 八門轉布：以「值使門」落值使宮，其餘依 休生傷杜景死驚開 順轉（沿門環順時針，不管陰陽）
  const skyDoor={};
  const ri=MEN_RING.indexOf(shiGong);
  const order=[MEN[0].n,MEN[1].n,MEN[2].n,MEN[3].n,MEN[4].n,MEN[5].n,MEN[6].n,MEN[7].n]; // 休生傷杜景死驚開
  const zsi0=order.indexOf(zhiShiMen);
  const zsi=zsi0<0?5:zsi0;                            // 值使門序位（異常時回退死門＝中五寄坤二）
  const rotated=order.slice(zsi).concat(order.slice(0,zsi));
  rotated.forEach((mn,k)=>{
    const pos=MEN_RING[((ri+k)%8+8)%8];
    skyDoor[pos]=mn;
  });

  // 八神：值符神落天盤值符星所在宮（=時干宮 p，中五寄二），依順時針八卦序飛布（陽順陰逆）
  const skyShen={};
  const shenRing=[1,8,3,4,9,2,7,6]; // 順時針八卦序（跳中五）
  const shenSeq=dun==="陽"
    ? ["值符","螣蛇","太陰","六合","勾陳","朱雀","九地","九天"]
    : ["值符","螣蛇","太陰","六合","白虎","玄武","九地","九天"];
  let pZF=p===5?2:p;
  let i0=shenRing.indexOf(pZF);
  shenSeq.forEach((sn,k)=>{ skyShen[shenRing[((i0+(dun==="陽"?1:-1)*k)%8+8)%8]]=sn; });

  // 空亡（日旬空：以日柱干支所屬之旬取空亡）、馬星（時支）
  const dayXunIdx=Math.floor(dayIdx/10)*10;   // 日柱旬首干支序
  const kong=[BRANCHES[(dayXunIdx%12+10)%12],BRANCHES[(dayXunIdx%12+11)%12]];
  const maBr={子:"寅",丑:"亥",寅:"申",卯:"巳",辰:"寅",巳:"亥",午:"申",未:"巳",申:"寅",酉:"亥",戌:"寅",亥:"巳"}[BRANCHES[hourIdx%12]];
  const kongGong=[],maGong=[];
  for(const g in GONG){
    if(GONG[g].zhi.some(z=>kong.includes(z))) kongGong.push(+g);
    if(GONG[g].zhi.includes(maBr)) maGong.push(+g);
  }
  return {dun,ju,earthGan,skyGan,skyStar,skyDoor,skyShen,xunName,xunYi,g0,
          zhiFuXing,zhiShiMen,shiGong,p,kong,kongGong,maGong,maBr,n,dir};
}

/* ================= 格局判斷 ================= */
function geJu(pp,dayIdx,hourIdx){
  const notes={};
  const wxGan={戊:"土",己:"土",庚:"金",辛:"金",壬:"水",癸:"水",丁:"火",丙:"火",乙:"木"};
  const jiXing={戊:3,己:2,庚:8,辛:9,壬:4,癸:4}; // 六儀擊刑宮
  const ruMu={乙:2,丙:6}; // 三奇入墓（木墓未→坤二、火墓戌→乾六）
  const heGe={"乙辛":"青龍逃走","辛乙":"白虎猖狂","丁癸":"朱雀投江","癸丁":"螣蛇夭矯",
              "庚丙":"太白入熒","丙庚":"熒入太白","戊丙":"青龍返首","丙戊":"飛鳥跌穴"};
  for(let g=1;g<=9;g++){
    const t=[],tg=pp.skyGan[g],dg=pp.earthGan[g];
    if(!tg) continue;
    if(tg===dg) t.push("伏吟");
    const dgp=DUI_GONG[g];
    if(pp.skyStar[g]===XING.find(s=>s.g===dgp)?.n) t.push("星反吟");
    if(jiXing[tg]===g) t.push("擊刑");
    if(ruMu[tg]===g) t.push("奇入墓");
    const hg=heGe[tg+dg]; if(hg) t.push(hg);
    if(tg==="庚"&&dg===STEMS[dayIdx%10]) t.push("伏干格");
    if(tg===STEMS[dayIdx%10]&&dg==="庚") t.push("飛干格");
    if(pp.skyDoor[g]==="丁") {} // 門非干
    if(tg==="丁"&&Object.values(pp.skyDoor)[Object.keys(pp.skyDoor).findIndex(k=>+k===g)]===undefined){}
    if(tg==="丁"&&pp.skyDoor[g]&&pp.zhiShiMen===pp.skyDoor[g]) t.push("玉女守門");
    // 門宮生剋
    const mn=pp.skyDoor[g];
    if(mn){
      const mw=MEN.find(m=>m.n===mn).wx, gw=GONG[g].wuxing;
      const ke=(a,b)=>(a==="木"&&b==="土")||(a==="土"&&b==="水")||(a==="水"&&b==="火")||(a==="火"&&b==="金")||(a==="金"&&b==="木");
      const sheng=(a,b)=>(a==="木"&&b==="火")||(a==="火"&&b==="土")||(a==="土"&&b==="金")||(a==="金"&&b==="水")||(a==="水"&&b==="木");
      if(ke(mw,gw)) t.push("門迫(門剋宮)");
      else if(ke(gw,mw)) t.push("門制(宮剋門)");
      else if(sheng(mw,gw)) t.push("門生宮");
      else if(sheng(gw,mw)) t.push("宮生門");
      if(mn===pp.zhiShiMen&&+g===pp.shiGong) t.push("值使");
    }
    if(pp.kongGong.includes(+g)) t.push("空亡");
    if(pp.maGong.includes(+g)) t.push("馬星");
    if(g===5) t.push("寄坤二");
    if(+g===pp.g0) t.push("旬首宮");
    notes[g]=t;
  }
  return notes;
}

function fmtYMD(j){const d=jdnToYMD(j);return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;}

function run(mode){
  const err=document.getElementById("err");
  err.style.display="none";
  const isLunar=document.getElementById("cal").value==="lunar";
  let Y,M,D,h,mi,lunarTag="";
  if(isLunar){
    const ly=+document.getElementById("ly").value;
    const lmv=document.getElementById("lm").value;
    const ld=+document.getElementById("ld").value;
    const lh=+document.getElementById("lhh").value;
    const lmi=+document.getElementById("lmi").value;
    if(!ly||!lmv||!ld){err.textContent="請完整選擇農曆 年／月／日／時／分";err.style.display="block";return;}
    const isLeap=lmv.slice(-1)==="L", lmNum=parseInt(lmv);
    const sol=lunar2solar(ly,lmNum,ld,isLeap);
    if(!sol){err.textContent="該農曆年無此閏月，請重新選擇";err.style.display="block";return;}
    Y=sol.y;M=sol.m;D=sol.d;h=lh;mi=lmi||0;
    lunarTag=`農曆 ${cnYear(ly)}年${isLeap?"閏":""}${cnNum(lmNum)}月${cnNum(ld)}日 ${hzNameOf(lh)}`;
  } else {
    const sy=+document.getElementById("sy").value;
    const sm=+document.getElementById("sm").value;
    const sd=+document.getElementById("sd").value;
    const sh=+document.getElementById("shh").value;
    const smi=+document.getElementById("smi").value;
    if(!sy||!sm||!sd){err.textContent="請完整選擇陽曆 年／月／日／時／分";err.style.display="block";return;}
    Y=sy;M=sm;D=sd;h=sh;mi=smi||0;
  }
  if(!lunarTag){
    const _l=solar2lunar(Y,M,D);
    if(_l) lunarTag=`農曆 ${cnYear(_l.y)}年${_l.isLeap?"閏":""}${cnNum(_l.m)}月${cnNum(_l.d)}日 ${hzNameOf(h)}`;
  }
  const inH=h,inMi=mi; // 輸入時分（未修正）
  const lon=parseFloat(document.getElementById("lon").value)||120;
  // 真太陽時（平太陽時差）
  const totalMin=h*60+mi+Math.round((lon-120)*4);
  let adjDay=0,hh=Math.floor(totalMin/60);
  if(hh>=24){hh-=24;adjDay=1;} if(hh<0){hh+=24;adjDay=-1;}
  h=hh;mi=totalMin%60;
  let brIdx=Math.floor(((h+1)%24)/2); // 時支
  let dayJ=jdn(Y,M,D)+(h>=23?1:0)+adjDay; // 23時後日柱進一日
  if(h>=23&&adjDay===1){/*已含*/}
  let dayIdx=dayGZ(dayJ);
  let hourIdx=hourGZ(dayIdx,brIdx);

  // 定局：由「時間排盤」（自動置閏法）或「自訂局排盤」按鈕決定
  const manual=(mode==="custom")?"custom":"auto";
  let juInfo, cDayIdx=null, cBrIdx=null;
  if(manual==="auto"){
    juInfo=dingJu(dayJ);
  } else {
    // 自訂局：直接指定日柱／時辰／局（時干以五鼠遁由日柱推得）
    cDayIdx=+document.getElementById("cdgz").value;
    cBrIdx=+document.getElementById("chbr").value;
    const cuv=document.getElementById("cju").value;
    juInfo={F0:dayJ,term:null,yuan:0,label:"自訂局",fuTou:GZ(cDayIdx),ju:+cuv.slice(1),dun:cuv[0],isRun:false};
  }
  if(cDayIdx!==null){ dayIdx=cDayIdx; brIdx=cBrIdx; hourIdx=hourGZ(dayIdx,brIdx); }
  const pp=paipan(dayJ,brIdx,hourIdx,juInfo,dayIdx);
  const notes=geJu(pp,dayIdx,hourIdx);

  // 四柱
  let {yearIdx, monthGanIdx, mBr}=yearMonthGZ(Y,dayJ);
  // 自訂局：年柱、月柱亦可直接指定（僅影響顯示，不影響排盤）
  if(manual!=="auto"){
    yearIdx=+document.getElementById("cygz").value;
    const cmi=+document.getElementById("cmgz").value;
    monthGanIdx=cmi%10; mBr=cmi%12;
  }

  const headbox=document.getElementById("headbox");
  headbox.style.display="block";
  // 標題下方一行：確認的起局時間；自訂局則顯示自訂條件
  const pad2=n=>String(n).padStart(2,"0");
  const dtIn=`${Y}/${pad2(M)}/${pad2(D)} ${pad2(inH)}:${pad2(inMi)}`;
  const adjMin=Math.round((lon-120)*4);
  const dtAdj=adjMin!==0?`（真太陽時 ${pad2(((h%24)+24)%24)}:${pad2(((mi%60)+60)%60)}${adjDay?(adjDay>0?" 次日":" 前日"):""}）`:"";
  const aliasLine = manual==="auto" ? `起局時間：${dtIn}${lunarTag?`（${lunarTag}）`:""}${dtAdj}`
    : `自訂局：${GZ(dayIdx)}日 ${BRANCHES[brIdx]}時　${pp.dun}遁${cnNum(pp.ju)}局`;
  const jiePill = manual==="auto"
    ? `<span class="pill">節氣：<b>${juInfo.term.name}</b>${["上","中","下"][juInfo.yuan]}元（符頭 ${juInfo.fuTou}・${juInfo.label}）</span>`
    : `<span class="pill">定局：<b>自訂局</b>（日柱 ${GZ(dayIdx)}・${BRANCHES[brIdx]}時・${pp.dun}遁${cnNum(pp.ju)}局）</span>`;
  headbox.innerHTML=`
    <div class="ju-title${pp.dun==="陰"?" yin":""}">${pp.dun==="陽"?"陽遁"+cnNum(pp.ju)+"局":"陰遁"+cnNum(pp.ju)+"局"}</div>
    <div class="ju-alias">〔 ${aliasLine} 〕</div>
    <div class="gz-line${pp.dun==="陰"?" yin":""}">${GZ(yearIdx)}年　${STEMS[monthGanIdx]+BRANCHES[mBr]}月　<span class="s">${GZ(dayIdx)}</span>日　<span class="b">${GZ(hourIdx)}</span>時</div>
    <div class="fuzhu">
      ${jiePill}
      <span class="pill">時旬首：<b>${pp.xunName}</b>遁 <b>${pp.xunYi}</b></span>
      <span class="pill">日旬空：<b class="warn">${pp.kong.join("、")}</b></span>
      <span class="pill">馬星：<b>${pp.maBr}</b></span>
      ${pp.p===5&&STEMS[hourIdx%10]==="甲"?'<span class="pill warn">六甲時・伏吟</span>':""}
    </div>
    <div class="fuzhu">
      <span class="pill"><b>${pp.zhiFuXing}</b> 值符加 ${GONG[pp.p].name}${pp.p}宮（隨時干${STEMS[hourIdx%10]==="甲"?"甲遁"+pp.xunYi:STEMS[hourIdx%10]}）</span>
      <span class="pill"><b>${pp.zhiShiMen}</b> 值使加 ${GONG[pp.shiGong].name}${pp.shiGong}宮</span>
      ${(()=>{const hStem=STEMS[hourIdx%10];
        const ke=(a,b)=>({木:{土:1},土:{水:1},水:{火:1},火:{金:1},金:{木:1}}[a]||{})[b];
        return ke(hStem==="甲"?pp.xunYi:hStem)&&ke(hStem==="甲"?pp.xunYi:hStem,STEMS[dayIdx%10])?'<span class="pill warn">五不遇時（時干剋日干）</span>':"";})()}
    </div>`;

  // 九宮盤
  const grid=document.getElementById("grid9");
  grid.style.display="grid";
  const layout=[[4,9,2],[3,5,7],[8,1,6]];
  const doorCls={"大吉":"dorgood","吉":"dorgood","小吉":"dorgood","平":"dormid","小凶":"dorbad","凶":"dorbad","大凶":"dorbad"};
  grid.innerHTML=layout.flat().map(g=>{
    const G=GONG[g];
    const shen=pp.skyShen[g]||"";
    const door=pp.skyDoor[g];
    const star=pp.skyStar[g];
    const tg=pp.skyGan[g],dg=pp.earthGan[g];
    const doorJJ=door?MEN.find(m=>m.n===door).jj:"";
    const nts=(notes[g]||[]).filter(x=>["空亡","馬星","擊刑","寄坤二"].includes(x));
    return `<div class="cell ${g===5?"mid":""}">
      <div class="gong-name">${G.tri} ${G.name}${g}宮</div>
      <div class="badges">${nts.map(x=>`<span class="bdg ${x==="馬星"?"blue":x==="寄坤二"?"gray":""}">${x}</span>`).join("")}</div>
      <div class="row1"><span class="gan-tian">${tg||""}</span><span class="god">${shen?SHEN_ABBR[shen]||shen:""}</span><span class="star ${star===pp.zhiFuXing?"zf":""}">${star?XING_ABBR(star):""}</span></div>
      <div class="row2"><span class="gan-di">${dg||""}</span><span></span><span class="door ${["休門","生門","開門"].includes(door)?"ji ":""}${door===pp.zhiShiMen?"zs":""}">${door?MEN_ABBR(door):""}</span></div>
    </div>`;
  }).join("");

  // 逐宮明細（乾坎艮震巽離坤兌）
  const detOrder=[6,1,8,3,4,9,2,7];
  const detbox=document.getElementById("detbox");
  detbox.style.display="block";
  detbox.innerHTML=`<div class="subhd">逐宮明細</div>
  <div class="tablewrap"><table class="det"><tr>${detOrder.map(g=>`<th>${GONG[g].tri} ${GONG[g].name}${g}</th>`).join("")}</tr>
  <tr>${detOrder.map(g=>`<td class="gname">${GONG[g].name}${g}宮<br><span class="small">${GONG[g].zhi.join("")||"-"}</span></td>`).join("")}</tr>
  <tr>${detOrder.map(g=>`<td>${pp.skyShen[g]?"神："+pp.skyShen[g]:"—"}</td>`).join("")}</tr>
  <tr>${detOrder.map(g=>{const d=pp.skyDoor[g];const jj=d?MEN.find(m=>m.n===d).jj:"";return `<td>${d?`<span class="${doorCls[jj]}">${d}</span>(${jj})`:"寄坤二"}</td>`;}).join("")}</tr>
  <tr>${detOrder.map(g=>`<td>${pp.skyStar[g]?pp.skyStar[g]:"—"}${pp.skyStar[g]==="天禽"?"<br><span class='small'>寄坤二</span>":""}</td>`).join("")}</tr>
  <tr>${detOrder.map(g=>`<td><span class="gan-tian" style="font-size:20px">${pp.skyGan[g]||""}</span> / <span class="gan-di" style="font-size:20px">${pp.earthGan[g]}</span></td>`).join("")}</tr>
  <tr>${detOrder.map(g=>`<td class="note">${(notes[g]||[]).join("、")||"—"}</td>`).join("")}</tr></table></div>`;

  // 解盤說明
  const MEN_TXT={"開門":"吉。開業、求官、遠行、見貴，百事亨通。","休門":"吉。休息、聚會、經商、嫁娶、謁貴。","生門":"大吉。營造、求財、婚娶、謀事。","傷門":"凶。傷災病痛、是非；宜討債、捕獵。","杜門":"小凶偏平。阻塞閉塞；宜隱藏防守。","景門":"平。文書、考試、宴會；不久長。","死門":"大凶。忌出行謀事；宜弔喪、行刑、漁獵。","驚門":"凶。驚恐官司口舌；宜追捕逃亡。"};
  const XING_TXT={"天蓬":"大凶星（水）。訟庭爭競；所入之宮不宜嫁娶營造。","天芮":"大凶星（土）。疾病、師友授道；不宜遠行訴訟。","天沖":"小吉星（木）。宜出軍報仇、捕捉；不利嫁娶商賈。","天輔":"大吉星（木）。宜遠行、修造、婚娶、請客。","天禽":"吉星（土）。宜遠行、做生意、見貴。","天心":"大吉星（金）。宜求醫服藥、經商、遷葬。","天柱":"小凶星（金）。宜隱跡固守；不宜出行謀事。","天任":"小吉星（土）。祭祀求官嫁娶、商賈造葬皆吉。","天英":"小凶星（火）。爐火殘患；嫁娶遠行皆不宜。"};
  const SHEN_TXT={"值符":"天乙之神，百惡消散；急則從神。","螣蛇":"虛詐之神，驚恐怪異。","太陰":"蔭佑之神，可藏兵避難。","六合":"護衛之神，婚姻交易。","白虎":"兇惡剛猛，兵戈殺伐。","玄武":"奸讒盜賊，口舌陰謀。","九地":"堅守之神，屯兵固守。","九天":"威悍之神，揚兵布陣。"};
  let jieHTML=`<div class="subhd">解盤說明</div>`;
  jieHTML+=`<h3>盤面綱要</h3><ul>
    <li><b>值符 ${pp.zhiFuXing}</b>（${XING_TXT[pp.zhiFuXing]}）臨 ${GONG[pp.p].name}${pp.p}宮。</li>
    <li><b>值使 ${pp.zhiShiMen}</b>（${MEN_TXT[pp.zhiShiMen]}）臨 ${GONG[pp.shiGong].name}${pp.shiGong}宮。</li>
    <li><b>日旬空</b>：${pp.kong.join("、")}——臨宮（${pp.kongGong.map(g=>GONG[g].name+g).join("、")}）之事多虛不實。</li>
    <li><b>馬星 ${pp.maBr}</b>：臨 ${pp.maGong.map(g=>GONG[g].name+g).join("、")}宮，主變動、出行、快速。</li></ul>`;
  jieHTML+=`<h3>各宮要義（有門有干者）</h3><ul>`;
  for(const g of [1,2,3,4,6,7,8,9]){
    const mn=pp.skyDoor[g],st=pp.skyStar[g],sn=pp.skyShen[g];
    if(!mn&&!st&&!pp.skyGan[g]) continue;
    const parts=[];
    if(sn) parts.push(`<b>${sn}</b>：${SHEN_TXT[sn]}`);
    if(st) parts.push(`<b>${st}</b>：${XING_TXT[st]}`);
    if(mn) parts.push(`<b>${mn}</b>：${MEN_TXT[mn]}`);
    if(pp.skyGan[g]) parts.push(`天盤 ${pp.skyGan[g]} 加地盤 ${pp.earthGan[g]}${(notes[g]||[]).length?`（${notes[g].filter(x=>!["空亡","馬星"].includes(x)).join("、")}）`:""}`);
    if(parts.length) jieHTML+=`<li><b>${GONG[g].name}${g}宮</b>：${parts.join("；")}。</li>`;
  }
  jieHTML+=`</ul>`;
  jieHTML+=`<h3>用法提要</h3><ul>
    <li><b>急則從神，緩從門</b>：事急從值符方，事緩擇吉門。</li>
    <li><b>三奇吉門</b>：乙丙丁三奇合開休生三吉門，百事皆宜。</li>
    <li><b>青龍返首、飛鳥跌穴</b>為大吉之格；<b>龍逃走、虎猖狂、雀投江、蛇夭矯</b>為大凶之格。</li>
    <li><b>門迫／門制</b>：吉門被迫吉事不成，凶門被迫凶事尤甚。</li>
    <li><b>空亡</b>主事虛；<b>馬星</b>主變動應速；<b>伏吟</b>主靜守不動，<b>反吟</b>主反覆。</li></ul>`;
  const jiebox=document.getElementById("jiebox");
  jiebox.style.display="block";
  jiebox.innerHTML=jieHTML;
}

function now(){
  const d=new Date();
  const hh=d.getHours(), mm=d.getMinutes();
  // 陽曆欄位
  document.getElementById("sy").value=d.getFullYear();
  initSolarUI();
  document.getElementById("sm").value=String(d.getMonth()+1);
  refreshSolarDays();
  document.getElementById("sd").value=String(d.getDate());
  document.getElementById("shh").value=String(hh);
  document.getElementById("smi").value=String(mm);
  // 農曆欄位（同步為同一時刻）
  const l=solar2lunar(d.getFullYear(),d.getMonth()+1,d.getDate());
  if(l){
    document.getElementById("ly").value=l.y;
    refreshLunarUI();
    document.getElementById("lm").value=l.isLeap?(l.m+"L"):String(l.m);
    refreshDays();
    document.getElementById("ld").value=String(l.d);
    document.getElementById("lhh").value=String(hh);
    document.getElementById("lmi").value=String(mm);
  }
  // 僅填入時間，不自動排盤；確認無誤後再按「排盤」
}

// 填入自訂局選項、時辰選項；載入時帶入現在時間（不自動排盤）
(function(){
  // 自訂局五下拉：年柱／月柱／日柱（六十甲子）／時辰（十二支）／局（陽陰各九局，國字）
  {
    let a="",b="",c="";
    for(let i=0;i<60;i++) a+=`<option value="${i}">${GZ(i)}</option>`;
    for(let i=0;i<12;i++) b+=`<option value="${i}">${BRANCHES[i]}</option>`;
    for(const d of ["陽","陰"]) for(let j=1;j<=9;j++) c+=`<option value="${d}${j}">${d}${cnNum(j)}局</option>`;
    for(const id of ["cygz","cmgz","cdgz"]) document.getElementById(id).innerHTML=a;
    document.getElementById("chbr").innerHTML=b;
    document.getElementById("cju").innerHTML=c;
  }
  fillHM("lhh","lmi");
  const lyEl=document.getElementById("ly");
  lyEl.addEventListener("change",refreshLunarUI);
  lyEl.addEventListener("blur",refreshLunarUI);
  const syEl=document.getElementById("sy");
  syEl.addEventListener("change",refreshSolarDays);
  syEl.addEventListener("blur",refreshSolarDays);
  // 帶入現在時間（陽曆＋農曆同步），不自動排盤
  now();
  // 自訂局五下拉預設值：帶入現在時間的年柱／月柱／日柱／時辰，局則帶入置閏法所定之局
  try{
    const _y=+document.getElementById("sy").value, _m=+document.getElementById("sm").value, _d=+document.getElementById("sd").value;
    const _hh=+document.getElementById("shh").value;
    if(_y&&_m&&_d){
      const _j=jdn(_y,_m,_d)+(_hh>=23?1:0);
      const ym=yearMonthGZ(_y,_j);
      document.getElementById("cygz").value=String(ym.yearIdx);
      document.getElementById("cmgz").value=String(gzIdx(ym.monthGanIdx,ym.mBr));
      document.getElementById("cdgz").value=String(dayGZ(_j));
      document.getElementById("chbr").value=String(Math.floor(((_hh+1)%24)/2));
      const _ju=dingJu(_j);
      document.getElementById("cju").value=_ju.dun+_ju.ju;
    }
  }catch(e){}
})();
